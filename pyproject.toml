[project]
name = "bionic-agent-mcp"
version = "0.1.0"
description = "Local semantic memory + multi-stage tasks + governance as an MCP server (zero external API)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30.0,<2.0.0",
    "fastembed>=0.7.3,<1.0.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
# S6-FINAL-FIX P1-2：`static/*` 是星图用的 3d-force-graph（1.39 MB，自包含
# three.js）。`app/admin_ui.html:695` 通过 `/static/3d-force-graph.min.js`
# 加载它、`app/admin_ui.py:1378` 的 STATIC_DIR 也指向 `app/static/`；漏掉就
# 会让 pip 装出来的包打开星图 404（build_zip.py 打的 zip 里是有的，两条分发
# 路径不一致）。`py.typed` 目前没有实体文件，声明保留无害。
app = ["py.typed", "admin_ui.html", "static/*"]

[project.scripts]
bionic-agent = "app.mcp_server:_run_cli"
bionic-agent-governance = "app.mcp_server_gov:_run_cli"
bionic-agent-admin = "app.admin_ui:_run_cli"

[tool.setuptools.exclude-package-data]
app = ["__pycache__", "*.pyc"]
