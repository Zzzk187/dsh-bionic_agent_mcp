# DeepSeek Harness — MCP server configuration (Phase 8.5: core + governance split)
#
# Two instances share the same SQLite database and the same app.* backend, but
# are launched as SEPARATE MCP servers. Mount only `bionic-agent` for daily
# use (36 core tools); attach `bionic-agent-governance` only
# when you need the governance / lifecycle / restore tools (49 tools). Mounting
# the governance instance on demand cuts the per-session fixed tool-list token
# cost from 85 (all at once) to 36 (core only).
#
# IMPORTANT: use the `-m` entry point (NOT a direct script path). A direct
# `args: [.../app/mcp_server_gov.py]` would set sys.path[0] to the app/ dir and
# break `from app import ...`. The `-m` form is handled automatically.
# Replace the paths with real absolute paths on your machine.

# --- Core instance (daily + export/validate/memory packages, 36) — mount by default ---
- id: bionic-agent
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: bionic-agent
    transport: stdio
    command: 'C:/YOUR/PATH/bionic-agent-mcp/.venv/Scripts/python.exe'
    args:
      - '-m'
      - 'app.mcp_server'
    cwd: 'C:/YOUR/PATH/bionic-agent-mcp'

# --- Governance instance (governance / lifecycle / restore, 49) — attach on demand ---
- id: bionic-agent-governance
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: bionic-agent-governance
    transport: stdio
    command: 'C:/YOUR/PATH/bionic-agent-mcp/.venv/Scripts/python.exe'
    args:
      - '-m'
      - 'app.mcp_server_gov'
    cwd: 'C:/YOUR/PATH/bionic-agent-mcp'
